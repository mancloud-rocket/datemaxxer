<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datemaxxer · Tu bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ============ EL SHELL (sidebar) + BITÁCORA ============
   set piece: "la bitácora de vuelo" - cada análisis pasado es una entrada
   de bitácora, no una card de historial genérica: fecha en mono, mini-
   instrumento (arco de zona + marcador, mismo lenguaje que el medidor real
   del informe) para lecturas completas, sello de estado a la derecha.
   Entran apilándose una a una, como se llena un libro de vuelo.
   QA: ?dev=1 · ?nav=historial · ?estado=listo|vacia|error · ?n=0..6 · ?qa=0..1
   ============================================================= */
body{overflow-x:clip}
[hidden]{display:none!important}

/* ---- shell: idéntico a settings.html, la sidebar es chrome persistente ---- */
.shell{display:flex;min-height:100dvh}
.sidebar{position:relative;width:248px;flex:none;display:flex;flex-direction:column;
  padding:1.6rem 1.2rem 1.4rem;background:var(--surface-2);border-right:1px solid var(--line);gap:1.8rem}
.sidebar::after{content:'';position:absolute;top:0;right:-1px;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(79,217,194,.18) 18%,rgba(79,217,194,.18) 82%,transparent)}
.sb-brand{display:flex;align-items:center;gap:.6rem}
.sb-brand svg{width:22px;height:22px;flex:none}
.sb-brand span{font-family:'Archivo Black',sans-serif;font-size:.92rem;letter-spacing:-.01em;color:var(--ink)}
.sb-nav{display:flex;flex-direction:column;gap:.5rem}
.sb-btn{position:relative;display:flex;align-items:center;gap:.7rem;padding:.75rem .85rem;
  border-radius:7px;background:var(--surface);border:1px solid var(--line);cursor:pointer;
  text-decoration:none;color:var(--ink-mute);font-family:'Inter Tight',sans-serif;font-weight:600;
  font-size:.9rem;transition:background .25s,border-color .25s,color .25s}
.sb-btn:hover{color:var(--ink);border-color:var(--steel-dim)}
.sb-btn .led{flex:none;width:7px;height:7px;border-radius:50%;background:var(--steel-dim);transition:background .3s,box-shadow .3s}
.sb-btn.on{background:rgba(79,217,194,.07);border-color:rgba(79,217,194,.4);color:var(--ink)}
.sb-btn.on .led{background:var(--signal);box-shadow:0 0 9px rgba(79,217,194,.85)}
.sb-btn.on::before{content:'';position:absolute;left:-1.2rem;top:.5rem;bottom:.5rem;width:2px;
  background:var(--signal);border-radius:2px;box-shadow:0 0 8px rgba(79,217,194,.6)}
.sb-spacer{flex:1}
.sb-user{display:flex;align-items:center;gap:.7rem;padding:.6rem;border-radius:8px}
.sb-badge{position:relative;flex:none;width:38px;height:38px}
.sb-badge img,.sb-badge .fallback{width:100%;height:100%;border-radius:8px;object-fit:cover;display:block}
.sb-badge .fallback{display:flex;align-items:center;justify-content:center;background:var(--surface);
  border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:.72rem;color:var(--ink-mute)}
.sb-badge svg{position:absolute;inset:-3px;pointer-events:none;overflow:visible}
.sb-badge svg path{fill:none;stroke:var(--steel);stroke-width:1.6;stroke-linecap:round}
.sb-info{min-width:0}
.sb-name{font-size:.84rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-mail{font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.02em;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
.sb-salir{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;
  padding:.7rem .8rem;border-radius:7px;background:transparent;border:1px solid var(--line);
  color:var(--steel);font-family:'Inter Tight',sans-serif;font-weight:600;font-size:.82rem;
  cursor:pointer;transition:color .25s,border-color .25s,background .25s}
.sb-salir:hover{color:var(--oxide);border-color:var(--stamp);background:rgba(201,75,50,.06)}
.sb-salir svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;min-width:0;padding:3.2rem 3rem 4rem;display:flex;justify-content:center}
.doc{width:min(640px,100%)}
@media (max-width:860px){
  .shell{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;align-items:center;padding:.9rem 1.1rem;gap:1rem;border-right:0;border-bottom:1px solid var(--line)}
  .sidebar::after{display:none}
  .sb-nav{flex-direction:row;gap:.4rem}
  .sb-btn{padding:.5rem .7rem;font-size:.78rem}
  .sb-btn span.lab{display:none}
  .sb-btn .led{width:6px;height:6px}
  .sb-user{margin-left:auto}
  .sb-info{display:none}
  .sb-salir{width:auto;padding:.5rem .65rem}
  .sb-salir span{display:none}
  .content{padding:2.2rem 1.2rem 3rem}
}

/* ---- header ---- */
.chead{margin-bottom:2.2rem}
.chead .kicker{margin-bottom:.6rem}
.chead h1{font-size:clamp(1.8rem,6vw,2.4rem)}

/* ---- la bitácora ---- */
.log{display:flex;flex-direction:column;gap:.85rem}
.entry{position:relative;display:flex;align-items:center;gap:1.2rem;padding:1.05rem 1.3rem;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  transition:border-color .25s,transform .25s;cursor:default}
.entry.clickable{cursor:pointer}
.entry.clickable:hover{border-color:var(--steel-dim);transform:translateY(-2px)}
.entry .fecha{flex:none;width:88px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  letter-spacing:.06em;color:var(--steel);text-transform:uppercase;line-height:1.4}
.entry .gauge{flex:none;width:58px;height:36px;overflow:visible}
.entry .gauge .zone{fill:none;stroke-linecap:round}
.entry .gauge .marker{fill:var(--void);stroke-width:2.4}
.entry .body{flex:1;min-width:0;display:flex;align-items:baseline;gap:.75rem}
.entry .score{font-family:'Archivo Black',sans-serif;font-size:1.5rem;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.entry .arq{color:var(--ink-mute);font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .parcial{color:var(--ink-mute);font-size:.88rem;font-weight:500}
.entry .estado{flex:none}

/* ---- estado vacío: página en blanco de la bitácora ---- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.1rem;
  padding:3.4rem 1.4rem;border:1.6px dashed var(--steel-dim);border-radius:12px}
.empty svg{width:52px;height:52px;color:var(--steel)}
.empty svg path,.empty svg line{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.empty h3{font-family:'Inter Tight';font-weight:700;font-size:1.1rem;color:var(--ink)}
.empty p{color:var(--ink-mute);font-size:.9rem;max-width:26em;line-height:1.5}

.loading-row{display:flex;align-items:center;gap:.7rem;color:var(--ink-mute);font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em}
.loading-row .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:ldot 1.1s ease-in-out infinite}
@keyframes ldot{0%,100%{opacity:.25}50%{opacity:1}}
.err-general{color:var(--oxide);font-size:.9rem}

@media (max-width:560px){
  .entry{flex-wrap:wrap;gap:.7rem .9rem}
  .entry .fecha{width:auto}
  .entry .body{width:100%;order:3}
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="vignette"></div>
<div class="telon cubierto"></div>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <svg viewBox="0 0 200 200"><defs><linearGradient id="wmgH" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6FEBD4"/><stop offset="1" stop-color="#2FAE97"/></linearGradient></defs>
        <g transform="translate(35 29) scale(1.477)">
          <path d="M6 0 L32 0 L80 96 L54 96 Z" fill="url(#wmgH)" stroke="#1E8A78" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M54 0 L80 0 L32 96 L6 96 Z" fill="url(#wmgH)" stroke="#1E8A78" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M29.5 21 C36 34 50 62 56.5 75" fill="none" stroke="#EAFBF6" stroke-width="2.6" stroke-linecap="round" opacity=".95"/>
          <path d="M56.4 21 C50 34 36 62 29.6 75" fill="none" stroke="#EAFBF6" stroke-width="2.6" stroke-linecap="round" opacity=".95"/>
          <circle cx="29.5" cy="21" r="4.6" fill="#101318" stroke="#EAFBF6" stroke-width="2"/><circle cx="56.4" cy="21" r="4.6" fill="#101318" stroke="#EAFBF6" stroke-width="2"/>
          <circle cx="29.6" cy="75" r="4.6" fill="#101318" stroke="#EAFBF6" stroke-width="2"/><circle cx="56.5" cy="75" r="4.6" fill="#101318" stroke="#EAFBF6" stroke-width="2"/>
        </g>
      </svg>
      <span>Datemaxxer</span>
    </div>

    <nav class="sb-nav" id="sbNav">
      <a class="sb-btn" href="mesa.html" data-nav="auditoria"><i class="led"></i><span class="lab">Auditoría</span></a>
      <a class="sb-btn" href="historial.html" data-nav="historial"><i class="led"></i><span class="lab">Historial</span></a>
      <a class="sb-btn" href="settings.html" data-nav="config"><i class="led"></i><span class="lab">Configuración</span></a>
    </nav>

    <div class="sb-spacer"></div>

    <div class="sb-user">
      <div class="sb-badge">
        <div class="fallback" id="sbFallback">FQ</div>
        <img id="sbPhoto" hidden alt="">
        <svg viewBox="0 0 44 44"><path d="M2 12 L2 2 L12 2 M32 2 L42 2 L42 12 M42 32 L42 42 L32 42 M12 42 L2 42 L2 32"/></svg>
      </div>
      <div class="sb-info">
        <div class="sb-name">Fernando</div>
        <div class="sb-mail">fernando@correo.com</div>
      </div>
    </div>

    <button class="sb-salir" id="sbSalir">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Cerrar sesión</span>
    </button>
  </aside>

  <main class="content">
    <div class="doc" id="doc">
      <header class="chead" id="chead">
        <p class="kicker"><i></i>Cada lectura, registrada</p>
        <h1 class="display">Tu bitácora.</h1>
      </header>

      <div class="loading-row" id="loadingRow"><span class="dot"></span>CARGANDO TU BITÁCORA…</div>
      <p class="err-general" id="errGeneral" hidden></p>

      <div class="log" id="log" hidden></div>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 48 48">
          <path d="M6 10 L6 40 L24 36 L42 40 L42 10 L24 14 Z"/>
          <path d="M24 14 L24 36"/>
          <line x1="11" y1="17" x2="19" y2="16" stroke-dasharray="2 3"/>
          <line x1="11" y1="23" x2="19" y2="22" stroke-dasharray="2 3"/>
          <line x1="11" y1="29" x2="19" y2="28" stroke-dasharray="2 3"/>
        </svg>
        <h3>Tu bitácora está en blanco</h3>
        <p>Todavía no completaste ninguna auditoría. Cuando lo hagas, cada lectura queda anotada aquí.</p>
        <a class="btn" href="mesa.html">Ir al checklist</a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="shared.js"></script>
<script>
telonEntrada();
(() => {
  const QA = qsParam('qa') === '1' || REDUCED;
  const nav = qsParam('nav') || 'historial';
  const estado = qsParam('estado') || 'listo';
  const N = Math.min(6, Math.max(0, parseInt(qsParam('n'), 10) || 4));

  document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('on', b.dataset.nav === nav));
  document.getElementById('sbSalir').addEventListener('click', () => telonHacia('ingreso.html'));

  /* ---- mini-instrumento: mismo lenguaje polar que el medidor del informe ---- */
  const CXg = 29, CYg = 34, Rg = 24;
  const ptg = (deg, r) => { const a = Math.PI - (deg / 100) * Math.PI; return [CXg + r * Math.cos(a), CYg - r * Math.sin(a)]; };
  const ZONAS = [[0, 40, '#C94B32'], [40, 70, '#E8B04B'], [70, 100, '#4FD9C2']];
  function buildGauge(score) {
    const svg = mk('svg', { viewBox: '0 0 58 36', class: 'gauge' });
    ZONAS.forEach(([a, b, col]) => {
      const [x0, y0] = ptg(a + 1.5, Rg), [x1, y1] = ptg(b - 1.5, Rg);
      mk('path', { d: `M${x0} ${y0} A${Rg} ${Rg} 0 0 1 ${x1} ${y1}`, class: 'zone', stroke: col, 'stroke-width': 5, opacity: .5 }, svg);
    });
    const zonaScore = ZONAS.find(([a, b]) => score >= a && score <= b) || ZONAS[0];
    const [mx, my] = ptg(score, Rg);
    mk('circle', { cx: mx, cy: my, r: 4, class: 'marker', stroke: zonaScore[2] }, svg);
    return svg;
  }

  /* ---- data demo (?dev=1 / QA de esta pantalla) ---- */
  const NOMBRES = { viajero: 'Viajero', intelectual: 'Intelectual', deportista: 'Deportista', creativo: 'Creativo', profesional: 'Profesional', outdoor: 'Outdoor', social: 'Social', hogareno: 'Hogareño' };
  const DEMO = [
    { dias: 0, status: 'done', score: 41, arq: 'viajero' },
    { dias: 12, status: 'done', score: 58, arq: 'profesional' },
    { dias: 29, status: 'error', fotos: 3, total: 6 },
    { dias: 41, status: 'done', score: 33, arq: 'social' },
    { dias: 58, status: 'analyzing', fotos: 4, total: 6 },
    { dias: 70, status: 'done', score: 76, arq: 'outdoor' },
  ];
  function fechaHace(dias) {
    const d = new Date(); d.setDate(d.getDate() - dias);
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase().replace('.', '');
  }

  const ESTADOS = { done: { label: 'Completa', clase: 's-cy' }, analyzing: { label: 'En curso', clase: 's-mute' }, error: { label: 'Falló', clase: '' } };

  function buildEntry(item) {
    const li = document.createElement('div');
    li.className = 'entry';
    const fecha = document.createElement('div'); fecha.className = 'fecha'; fecha.textContent = fechaHace(item.dias);
    li.appendChild(fecha);
    if (item.status === 'done') {
      li.appendChild(buildGauge(item.score));
      const body = document.createElement('div'); body.className = 'body';
      body.innerHTML = `<span class="score">${item.score}</span><span class="arq">${NOMBRES[item.arq] || item.arq}</span>`;
      li.appendChild(body);
    } else {
      const spacer = document.createElement('div'); spacer.className = 'gauge'; li.appendChild(spacer);
      const body = document.createElement('div'); body.className = 'body';
      body.innerHTML = `<span class="parcial">${item.fotos}/${item.total} fotos</span>`;
      li.appendChild(body);
    }
    const est = ESTADOS[item.status];
    const sello = document.createElement('span'); sello.className = `selloe ${est.clase}`; sello.textContent = est.label;
    sello.style.flex = 'none';
    const wrap = document.createElement('div'); wrap.className = 'estado'; wrap.appendChild(sello);
    li.appendChild(wrap);
    return li;
  }

  const loadingRow = document.getElementById('loadingRow');
  const log = document.getElementById('log');
  const empty = document.getElementById('empty');
  const errGeneral = document.getElementById('errGeneral');

  function mostrar() {
    loadingRow.hidden = true;
    if (estado === 'error') {
      errGeneral.hidden = false;
      errGeneral.textContent = 'No pudimos cargar tu bitácora. Recarga la página.';
      return;
    }
    if (estado === 'vacia') {
      empty.hidden = false;
      if (!QA) gsap.fromTo(empty, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: .6, ease: 'power2.out' });
      return;
    }
    log.hidden = false;
    DEMO.slice(0, N).forEach(item => log.appendChild(buildEntry(item)));
    const entries = [...log.children];
    if (QA || REDUCED) { gsap.set(entries, { autoAlpha: 1, y: 0 }); gsap.set('#chead', { autoAlpha: 1, y: 0 }); return; }
    gsap.set('#chead', { autoAlpha: 0, y: 18 });
    gsap.set(entries, { autoAlpha: 0, y: 16 });
    const tl = gsap.timeline();
    tl.to('#chead', { autoAlpha: 1, y: 0, duration: .5, ease: 'power2.out' }, 0)
      .to(entries, { autoAlpha: 1, y: 0, duration: .45, stagger: .09, ease: 'power2.out' }, .2);
  }

  if (QA) mostrar(); else gsap.delayedCall(.4, mostrar);
})();
</script>
</body>
</html>
