name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Un solo comando, el MISMO que se corre antes de commitear (`pnpm verify`).
      # Antes acá había una lista de pasos y localmente había otra, y las dos se
      # mantenían a mano: ya pasó dos veces que algo pasara local y rompiera el
      # deploy. Con un solo script las dos listas no pueden separarse.
      #
      # Cubre: typecheck (incluye los tests, que el build excluye), tests,
      # build de la API (lo que corre Render) y build de la web (lo que corre
      # Vercel).
      - name: Verificar
        run: pnpm verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: llave-de-build
          NEXT_PUBLIC_API_URL: https://ejemplo.invalid
