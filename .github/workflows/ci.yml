name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Corre lo MISMO que corre Render al deployar. `typecheck` usa
      # tsconfig.json y `build` usa tsconfig.build.json: son configs distintas
      # y ya pasó una vez que el deploy se rompiera con el CI en verde.
      - name: Build de producción (lo que corre Render)
        run: pnpm build:api

      - name: Build de la web (lo que corre Vercel)
        run: pnpm --filter @percentil/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: llave-de-build
          NEXT_PUBLIC_API_URL: https://ejemplo.invalid
