services:
  - type: web
    name: datemaxxer-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @percentil/contracts build && pnpm --filter @percentil/api build
    startCommand: pnpm --filter @percentil/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AUDIT_MODEL
        value: claude-opus-4-8
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AUDIT_RATE_LIMIT_MAX
        value: 5
      - key: AUDIT_FREE_LIMIT
        value: 1
      # Techo de una auditoría completa: pasado esto se marca error y se devuelve
      # el cupo, en vez de quedar "analizando" para siempre.
      - key: AUDIT_TIMEOUT_MS
        value: 300000
      # Las "analizando" más viejas que esto quedaron huérfanas de un reinicio
      # (deploy o sleep del plan free) y se cosechan al arrancar.
      - key: AUDIT_STALE_AFTER_MS
        value: 900000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Facturación con Paddle. Sin el secreto, el webhook responde 503 en vez de
      # aceptar eventos sin verificar la firma.
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_KIT
        sync: false
      - key: PADDLE_PRICE_COPILOTO
        sync: false
      # Admins (uids de Supabase separados por coma). Sin esto /admin/* responde
      # 404 para todos: el panel de planes queda inaccesible.
      - key: ADMIN_USER_IDS
        sync: false
      # Aviso por mail cuando alguien pide un plan. Sin RESEND_API_KEY o
      # ADMIN_EMAIL la solicitud igual se guarda y sale en el panel.
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PANEL_URL
        sync: false
