services:
  - type: web
    name: datemaxxer-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @percentil/contracts build && pnpm --filter @percentil/api build
    startCommand: pnpm --filter @percentil/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AUDIT_MODEL
        value: claude-opus-4-8
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AUDIT_RATE_LIMIT_MAX
        value: 5
      - key: AUDIT_FREE_LIMIT
        value: 1
      # Techo de una auditoría completa: pasado esto se marca error y se devuelve
      # el cupo, en vez de quedar "analizando" para siempre.
      - key: AUDIT_TIMEOUT_MS
        value: 300000
      # Las "analizando" más viejas que esto quedaron huérfanas de un reinicio
      # (deploy o sleep del plan free) y se cosechan al arrancar.
      - key: AUDIT_STALE_AFTER_MS
        value: 900000
      # F2 - estudio de fotos: limite propio y alto, es un editor con sliders
      # y cada ajuste es una request. No llama al modelo, solo a sharp.
      - key: PHOTOS_RATE_LIMIT_MAX
        value: 90
      # Radar: modelo chico a propósito, corre por swipe.
      - key: RADAR_MODEL
        value: claude-haiku-4-5-20251001
      - key: RADAR_RATE_LIMIT_MAX
        value: 30
      - key: RADAR_FREE_LIMIT
        value: 3
      - key: RADAR_KIT_LIMIT
        value: 30
      - key: RADAR_COPILOT_LIMIT
        value: 400
      - key: RADAR_VENTANA_DIAS
        value: 30
      # F5 - lectura de perfil ajeno. free y kit son cupo de por vida; copilot
      # es mensual corredizo, porque es lo que sostiene la suscripción.
      - key: PROFILE_READ_RATE_LIMIT_MAX
        value: 10
      - key: PROFILE_READ_FREE_LIMIT
        value: 1
      - key: PROFILE_READ_KIT_LIMIT
        value: 5
      - key: PROFILE_READ_COPILOT_LIMIT
        value: 60
      - key: PROFILE_READ_VENTANA_DIAS
        value: 30
      - key: PROFILE_READ_TIMEOUT_MS
        value: 300000
      # Coach de confianza. El cupo por plan es la palanca de upsell: gratis
      # alcanza para probarlo, Copiloto lo abre sin tope.
      - key: COACH_RATE_LIMIT_MAX
        value: 15
      - key: COACH_FREE_LIMIT
        value: 10
      - key: COACH_KIT_LIMIT
        value: 40
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Facturación con Paddle. Sin el secreto, el webhook responde 503 en vez de
      # aceptar eventos sin verificar la firma.
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_KIT
        sync: false
      - key: PADDLE_PRICE_COPILOTO
        sync: false
      # Admins (uids de Supabase separados por coma). Sin esto /admin/* responde
      # 404 para todos: el panel de planes queda inaccesible.
      - key: ADMIN_USER_IDS
        sync: false
      # Aviso por mail cuando alguien pide un plan. Sin RESEND_API_KEY o
      # ADMIN_EMAIL la solicitud igual se guarda y sale en el panel.
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PANEL_URL
        sync: false
